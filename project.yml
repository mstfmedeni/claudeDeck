# Xcode project for ClaudeDeck. Generate with:  xcodegen generate
# (ClaudeDeck.xcodeproj is generated — edit this file, not the project.)
name: ClaudeDeck
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Team, bundle prefix and version live in Config/Shared.xcconfig (override in Config/Local.xcconfig).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    # Extract Text/String(localized:) literals into the string catalogs (Localizable.xcstrings).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  # open-screen-sharing's dependencies (versions as pinned in its Package.resolved).
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  Perception:
    url: https://github.com/pointfreeco/swift-perception
    from: 2.0.12
  Atomics:
    url: https://github.com/apple/swift-atomics
    from: 1.3.1
targets:
  ClaudeDeckCore:
    type: library.static
    platform: macOS
    sources: [Sources/ClaudeDeckCore]
  ClaudeDeck:
    type: application
    platform: macOS
    sources:
      - Sources/ClaudeDeck
      - Support/Assets.xcassets   # AppIcon (generated by tools/make-icon.swift)
      - path: Support/THIRD_PARTY_LICENSES.txt
        buildPhase: resources
      - Support/Localizable.xcstrings   # English source, Turkish translation
    dependencies:
      - target: ClaudeDeckCore
      - package: SwiftTerm
      - package: Sparkle
      - target: ClaudeDeckWidget   # embedded in Contents/PlugIns
    entitlements:
      path: Support/ClaudeDeck.entitlements
      properties:
        # App Group shared with the widget (team-prefixed: no provisioning profile needed on macOS).
        com.apple.security.application-groups: [$(DECK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DECK_BUNDLE_PREFIX).ClaudeDeck
        PRODUCT_NAME: ClaudeDeck
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys; carries CFBundleURLTypes (claudedeck://) for widget taps.
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ClaudeDeck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Needs a real pty, ~/.claude and the user's shell: no App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  ClaudeDeckWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - target: ClaudeDeckCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ClaudeDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClaudeDeckWidget.entitlements
      properties:
        # Widget extensions must be sandboxed.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(DECK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DECK_BUNDLE_PREFIX).ClaudeDeck.Widget
        PRODUCT_NAME: ClaudeDeckWidget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # iPhone companion (remote mode): sees the Mac's sessions over Tailscale, answers prompts,
  # live terminal. Shares only the remote-mode files of ClaudeDeckCore (the rest is macOS-only).
  ClaudeDeckRemote:
    type: application
    platform: iOS
    sources:
      - iOS/ClaudeDeckRemote
      - iOS/Assets.xcassets   # AppIcon: the Mac icon, full-bleed (iOS masks the corners)
      - iOS/PrivacyInfo.xcprivacy   # open-screen-sharing's required-reason APIs (file timestamps, boot time)
      # Settings › Licenses (the app is GPL-3.0 because of open-screen-sharing).
      - path: Support/GPL-3.0.txt
        buildPhase: resources
      - path: Support/SCREEN_SHARING_LICENSES.txt
        buildPhase: resources
      - path: Support/THIRD_PARTY_LICENSES.txt
        buildPhase: resources
      - Sources/ClaudeDeckCore/RemoteProtocol.swift
      - Sources/ClaudeDeckCore/RemoteTransport.swift
      - Sources/ClaudeDeckCore/RemoteScreen.swift
      - Sources/ClaudeDeckCore/TailscaleAddress.swift
      - Sources/ClaudeDeckCore/APNs.swift
      - Sources/ClaudeDeckCore/RemoteCrypto.swift
      - Sources/ClaudeDeckCore/RemoteDiscovery.swift
      - Sources/ClaudeDeckCore/ConversationLog.swift
      - Sources/ClaudeDeckCore/SessionChanges.swift
      - Sources/ClaudeDeckCore/UnifiedDiff.swift
      - Sources/ClaudeDeckCore/RemoteFiles.swift
      - Sources/ClaudeDeckCore/RemoteTransferClient.swift
      - Sources/ClaudeDeckCore/PromptQueue.swift
      - Sources/ClaudeDeckCore/Agents.swift
      - Support/Localizable.xcstrings
    dependencies:
      - package: SwiftTerm
      - target: ScreenSharingKit
        embed: true
    entitlements:
      path: iOS/ClaudeDeckRemote.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DECK_BUNDLE_PREFIX).ClaudeDeckRemote
        PRODUCT_NAME: ClaudeDeckRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Deck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad multitasking (Split View, Stage Manager) wants every orientation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing QR code shown on your Mac."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Find your Mac on this network and connect to it directly."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Send your voice to the Mac while you share its screen."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  # The Mac's screen in the iOS app: open-screen-sharing (GPL-3.0, git submodule, branch
  # `claudedeck`) built as a framework with its own settings. Libsharing.xcframework comes from
  # `make -C Vendor/open-screen-sharing lib` (Go; build.sh / ios-release.sh run it).
  ScreenSharingKit:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/open-screen-sharing/OpenScreenSharing
        excludes:
          - "Demo/*.jpg"
          - "*.plist"
          - "*.entitlements"
          - "*.xml"
          - "PackageScripts/**"
          - "Resources/AppIcon.icon"
          - "Resources/InfoPlist.xcstrings"
          - "Resources/Localizable.xcstrings"
          - "Resources/PrivacyInfo.xcprivacy"
    dependencies:
      - framework: Vendor/open-screen-sharing/Frameworks/Libsharing.xcframework
        embed: false
      - package: GRDB
      - package: Perception
      - package: Atomics
        product: Atomics
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # Perception's back-ported Bindable is unavailable from iOS 17; the views need it.
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EMBEDDED"
        PRODUCT_BUNDLE_IDENTIFIER: $(DECK_BUNDLE_PREFIX).ScreenSharingKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  ClaudeDeckCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ClaudeDeckCoreTests]
    dependencies:
      - target: ClaudeDeckCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClaudeDeck:
    build:
      targets:
        ClaudeDeck: all
        ClaudeDeckCoreTests: [test]
    test:
      targets: [ClaudeDeckCoreTests]
  ClaudeDeckRemote:
    build:
      targets:
        ClaudeDeckRemote: all
